<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-yjKZD22El1rGTs4m4ykkjsdJi8n52K/Py9+mqdDlByw='; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Download your Yapstats recap</title>
<style>
:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
body { margin: 0; padding: 48px 20px; }
main { max-width: 38rem; margin: auto; }
h1 { font-size: clamp(2rem, 7vw, 3.25rem); line-height: 1.05; letter-spacing: -.05em; }
button { background: #ffd92e; color: #17171c; border: 0; border-radius: 10px; padding: 12px 18px; font: inherit; font-weight: 800; cursor: pointer; }
p { line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Your Yapstats recap</h1>
  <p>Download all your recap cards as one ZIP. Your private link expires seven days after purchase.</p>
  <button id="download" type="button" disabled>Download cards</button>
  <p id="message" role="status"></p>
  <p><a href="mailto:hello@yapstats.tech">Get help with your recap</a></p>
</main>
<script>
const button = document.getElementById('download');
const message = document.getElementById('message');
const [id, key] = location.hash.slice(1).split('.');
if (id && key) button.disabled = false;
else message.textContent = 'This link is incomplete. Open the full link from your Yapstats email.';
button.addEventListener('click', async () => {
  button.disabled = true;
  message.textContent = 'Downloading your cards…';
  try {
    const response = await fetch('/recap-email/file', { method: 'POST', body: new URLSearchParams({ id, key }) });
    if (!response.ok) {
      message.textContent = response.status === 404 ? 'This link has expired or is incomplete.' : 'The download couldn’t start. Try again.';
      return;
    }
    const url = URL.createObjectURL(await response.blob());
    const link = Object.assign(document.createElement('a'), { href: url, download: 'yapstats-full-recap.zip' });
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 60_000);
    message.textContent = 'Your download is ready.';
  } catch {
    message.textContent = 'The download couldn’t start. Check your connection and try again.';
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
